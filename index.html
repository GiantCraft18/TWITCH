<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twitch Viewer — вход через Twitch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0e0e10;
      --bg-panel: #18181b;
      --bg-elevated: #1f1f23;
      --bg-hover: #26262c;
      --accent: #9147ff;
      --accent-hover: #a970ff;
      --accent-soft: rgba(145, 71, 255, 0.15);
      --text-main: #efeff1;
      --text-muted: #adadb8;
      --text-dim: #6f6f78;
      --border: #2f2f35;
      --border-soft: #232329;
      --live: #eb0400;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.65);
      --transition: 0.18s ease;
      --header-h: 64px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      font-size: 14px;
      line-height: 1.5;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input { font-family: inherit; }
    img { display: block; max-width: 100%; }

    /* ===== ШАПКА ===== */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .logo-icon {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(145, 71, 255, 0.35);
    }

    .logo-text {
      background: linear-gradient(135deg, #a970ff, #9147ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Поиск */
    .search-wrapper {
      position: relative;
      flex: 1;
      max-width: 480px;
    }

    .search-box { position: relative; display: flex; align-items: center; }

    .search-icon {
      position: absolute;
      left: 14px;
      color: var(--text-dim);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 11px 14px 11px 42px;
      background: var(--bg-elevated);
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: all var(--transition);
    }

    .search-input::placeholder { color: var(--text-dim); }

    .search-input:focus {
      background: var(--bg-main);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .search-results {
      position: absolute;
      top: calc(100% + 8px);
      left: 0; right: 0;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      max-height: 420px;
      overflow-y: auto;
      display: none;
      box-shadow: var(--shadow-lg);
      z-index: 200;
    }

    .search-results.visible { display: block; }

    .search-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      cursor: pointer;
      border-bottom: 1px solid var(--border-soft);
      transition: background var(--transition);
    }

    .search-item:last-child { border-bottom: none; }
    .search-item:hover { background: var(--bg-hover); }

    .search-item-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 2px solid var(--border);
    }

    .search-item-avatar.live { border-color: var(--live); }

    .search-item-info { flex: 1; min-width: 0; }

    .search-item-name {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-item-game {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      background: var(--live);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .live-badge::before {
      content: '';
      width: 5px; height: 5px;
      background: #fff;
      border-radius: 50%;
      margin-right: 4px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Кнопка входа */
    .auth-section {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
      flex-shrink: 0;
    }

    .auth-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      background: var(--accent);
      color: #fff;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      transition: all var(--transition);
    }

    .auth-btn:hover { background: var(--accent-hover); }

    .user-info {
      display: none;
      align-items: center;
      gap: 10px;
    }

    .user-info.visible { display: flex; }

    .user-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2px solid var(--accent);
    }

    .user-name {
      font-size: 13px;
      font-weight: 600;
    }

    .logout-btn {
      font-size: 12px;
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      transition: all var(--transition);
    }

    .logout-btn:hover { background: var(--bg-hover); color: var(--text-main); }

    /* ===== ОСНОВНАЯ ОБЛАСТЬ ===== */
    .main {
      position: fixed;
      top: var(--header-h);
      left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 16px;
    }

    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .player-avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
      flex-shrink: 0;
      background: var(--bg-elevated);
    }

    .player-avatar.live {
      border-color: var(--live);
      box-shadow: 0 0 0 3px rgba(235, 4, 0, 0.2);
    }

    .player-titles { min-width: 0; }

    .player-title {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Контейнер с плеером и чатом */
    .content-area {
      flex: 1;
      display: flex;
      gap: 16px;
      min-height: 0;
    }

    .player-container {
      flex: 1;
      background: #000;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border-soft);
      min-height: 0;
    }

    #twitch-embed { width: 100%; height: 100%; }

    /* Свой чат */
    .chat-container {
      width: 340px;
      background: var(--bg-panel);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-soft);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .chat-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-soft);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-status {
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 400;
    }

    .chat-status.connected { color: #00db84; }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chat-message {
      font-size: 13px;
      line-height: 1.4;
      word-wrap: break-word;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-message-author {
      font-weight: 700;
      color: var(--accent);
      margin-right: 6px;
    }

    .chat-message-text { color: var(--text-main); }

    .chat-input-area {
      padding: 10px;
      border-top: 1px solid var(--border-soft);
    }

    .chat-input {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-elevated);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      transition: all var(--transition);
    }

    .chat-input:focus {
      border-color: var(--accent);
      background: var(--bg-main);
    }

    .chat-input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .chat-login-prompt {
      padding: 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .chat-login-prompt button {
      margin-top: 12px;
      padding: 10px 20px;
      background: var(--accent);
      color: #fff;
      border-radius: var(--radius-sm);
      font-weight: 600;
    }

    /* Адаптив */
    @media (max-width: 900px) {
      .content-area { flex-direction: column; }
      .chat-container { width: 100%; height: 280px; }
    }

    @media (max-width: 600px) {
      .header { padding: 0 12px; gap: 10px; }
      .logo-text { display: none; }
      .main { padding: 12px; }
      .search-wrapper { max-width: none; }
      .auth-btn span { display: none; }
    }
  </style>
</head>
<body>

  <!-- ===== ШАПКА ===== -->
  <header class="header">
    <div class="logo">
      <div class="logo-icon">🎮</div>
      <div class="logo-text">Twitch Viewer</div>
    </div>

    <div class="search-wrapper">
      <div class="search-box">
        <span class="search-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </span>
        <input type="text" id="searchInput" class="search-input" placeholder="Поиск стримеров..." autocomplete="off" />
      </div>
      <div id="searchResults" class="search-results"></div>
    </div>

    <!-- Кнопка входа через Twitch -->
    <div class="auth-section">
      <button class="auth-btn" id="loginBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/>
        </svg>
        <span>Войти через Twitch</span>
      </button>
      <div class="user-info" id="userInfo">
        <img class="user-avatar" id="userAvatar" alt="" />
        <span class="user-name" id="userName"></span>
        <button class="logout-btn" id="logoutBtn">Выйти</button>
      </div>
    </div>
  </header>

  <!-- ===== ОСНОВНАЯ ОБЛАСТЬ ===== -->
  <main class="main">
    <div class="player-header">
      <div class="player-info">
        <img class="player-avatar" id="playerAvatar" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%231f1f23'/%3E%3C/svg%3E" />
        <div class="player-titles">
          <div class="player-title" id="playerTitle">Выберите стримера</div>
          <div class="player-subtitle" id="playerSubtitle">Введите имя канала или воспользуйтесь поиском</div>
        </div>
      </div>
    </div>

    <div class="content-area">
      <div class="player-container">
        <div id="twitch-embed"></div>
      </div>

      <!-- Свой чат -->
      <div class="chat-container">
        <div class="chat-header">
          <span>Чат</span>
          <span class="chat-status" id="chatStatus">Не подключен</span>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area" id="chatInputArea">
          <div class="chat-login-prompt" id="chatLoginPrompt">
            Войдите через Twitch, чтобы писать в чат
            <br>
            <button onclick="loginWithTwitch()">Войти</button>
          </div>
          <input type="text" class="chat-input" id="chatInput" placeholder="Напишите сообщение..." style="display:none;" disabled />
        </div>
      </div>
    </div>
  </main>

  <script src="https://embed.twitch.tv/embed/v1.js"></script>
  <script>
    // ================================================================
    // НАСТРОЙКИ
    // ================================================================
    const CLIENT_ID = 'ВАШ_CLIENT_ID';
    const CLIENT_SECRET = 'ВАШ_CLIENT_SECRET';
    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const SCOPES = 'chat:read chat:edit user:read:email';

    // ================================================================
    // СОСТОЯНИЕ
    // ================================================================
    const state = {
      currentChannel: 'twitch',
      currentChannelData: null,
      appAccessToken: null,
      userAccessToken: null,
      userData: null,
      embed: null,
      ircSocket: null,
      ircConnected: false
    };

    // ================================================================
    // DOM
    // ================================================================
    const els = {
      searchInput: document.getElementById('searchInput'),
      searchResults: document.getElementById('searchResults'),
      playerTitle: document.getElementById('playerTitle'),
      playerSubtitle: document.getElementById('playerSubtitle'),
      playerAvatar: document.getElementById('playerAvatar'),
      embedContainer: document.getElementById('twitch-embed'),
      loginBtn: document.getElementById('loginBtn'),
      userInfo: document.getElementById('userInfo'),
      userAvatar: document.getElementById('userAvatar'),
      userName: document.getElementById('userName'),
      logoutBtn: document.getElementById('logoutBtn'),
      chatMessages: document.getElementById('chatMessages'),
      chatInput: document.getElementById('chatInput'),
      chatLoginPrompt: document.getElementById('chatLoginPrompt'),
      chatStatus: document.getElementById('chatStatus')
    };

    // ================================================================
    // PKCE (для OAuth без бэкенда)
    // ================================================================
    function generateRandomString(length) {
      const array = new Uint8Array(length);
      crypto.getRandomValues(array);
      return Array.from(array, b => b.toString(16).padStart(2, '0')).join('');
    }

    async function generateCodeChallenge(verifier) {
      const encoder = new TextEncoder();
      const data = encoder.encode(verifier);
      const digest = await crypto.subtle.digest('SHA-256', data);
      const base64 = btoa(String.fromCharCode(...new Uint8Array(digest)));
      return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
    }

    // ================================================================
    // OAUTH — ВХОД ЧЕРЕЗ TWITCH
    // ================================================================
    async function loginWithTwitch() {
      const verifier = generateRandomString(32);
      const challenge = await generateCodeChallenge(verifier);
      const stateParam = generateRandomString(16);

      sessionStorage.setItem('pkce_verifier', verifier);
      sessionStorage.setItem('oauth_state', stateParam);

      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        redirect_uri: REDIRECT_URI,
        response_type: 'code',
        scope: SCOPES,
        state: stateParam,
        code_challenge: challenge,
        code_challenge_method: 'S256'
      });

      window.location.href = `https://id.twitch.tv/oauth2/authorize?${params}`;
    }

    async function handleOAuthCallback() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const returnedState = params.get('state');
      const savedState = sessionStorage.getItem('oauth_state');

      if (!code || returnedState !== savedState) return false;

      const verifier = sessionStorage.getItem('pkce_verifier');
      sessionStorage.removeItem('oauth_state');
      sessionStorage.removeItem('pkce_verifier');

      try {
        const res = await fetch('https://id.twitch.tv/oauth2/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            client_id: CLIENT_ID,
            client_secret: CLIENT_SECRET,
            code: code,
            grant_type: 'authorization_code',
            redirect_uri: REDIRECT_URI,
            code_verifier: verifier
          })
        });

        const data = await res.json();
        if (data.access_token) {
          state.userAccessToken = data.access_token;
          localStorage.setItem('twitch_user_token', data.access_token);
          if (data.refresh_token) {
            localStorage.setItem('twitch_refresh_token', data.refresh_token);
          }
          window.history.replaceState({}, '', window.location.pathname);
          return true;
        }
      } catch (err) {
        console.error('Ошибка OAuth:', err);
      }
      return false;
    }

    async function loadUserData() {
      if (!state.userAccessToken) return;

      try {
        const res = await fetch('https://api.twitch.tv/helix/users', {
          headers: {
            'Client-ID': CLIENT_ID,
            'Authorization': `Bearer ${state.userAccessToken}`
          }
        });
        const data = await res.json();
        if (data.data && data.data[0]) {
          state.userData = data.data[0];
          els.userAvatar.src = state.userData.profile_image_url;
          els.userName.textContent = state.userData.display_name;
          els.loginBtn.style.display = 'none';
          els.userInfo.classList.add('visible');
          els.chatInput.style.display = 'block';
          els.chatInput.disabled = false;
          els.chatLoginPrompt.style.display = 'none';
        }
      } catch (err) {
        console.error('Ошибка загрузки пользователя:', err);
      }
    }

    function logout() {
      state.userAccessToken = null;
      state.userData = null;
      localStorage.removeItem('twitch_user_token');
      localStorage.removeItem('twitch_refresh_token');

      els.loginBtn.style.display = 'flex';
      els.userInfo.classList.remove('visible');
      els.chatInput.style.display = 'none';
      els.chatInput.disabled = true;
      els.chatLoginPrompt.style.display = 'block';

      if (state.ircSocket) {
        state.ircSocket.close();
        state.ircSocket = null;
        state.ircConnected = false;
        els.chatStatus.textContent = 'Не подключен';
        els.chatStatus.classList.remove('connected');
      }
    }

    // ================================================================
    // APP ACCESS TOKEN (для поиска)
    // ================================================================
    async function getAppAccessToken() {
      if (state.appAccessToken) return state.appAccessToken;

      const url = `https://id.twitch.tv/oauth2/token?client_id=${CLIENT_ID}&client_secret=${CLIENT_SECRET}&grant_type=client_credentials`;
      const res = await fetch(url, { method: 'POST' });
      const data = await res.json();
      state.appAccessToken = data.access_token;
      return state.appAccessToken;
    }

    // ================================================================
    // TWITCH IRC CHAT
    // ================================================================
    function connectToChat(channel) {
      if (!state.userAccessToken || !state.userData) return;

      if (state.ircSocket) {
        state.ircSocket.close();
      }

      const socket = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
      state.ircSocket = socket;

      socket.onopen = () => {
        const token = state.userAccessToken.replace('oauth:', '');
        socket.send(`PASS oauth:${token}`);
        socket.send(`NICK ${state.userData.login}`);
        socket.send(`JOIN #${channel}`);
        state.ircConnected = true;
        els.chatStatus.textContent = 'Подключен';
        els.chatStatus.classList.add('connected');
        addChatMessage('Система', `Подключен к чату #${channel}`, '#00db84');
      };

      socket.onmessage = (event) => {
        const lines = event.data.split('\r\n');
        lines.forEach(line => {
          if (!line) return;

          if (line.startsWith('PING')) {
            socket.send('PONG :tmi.twitch.tv');
            return;
          }

          if (line.includes('PRIVMSG')) {
            const match = line.match(/:(\w+)!\w+@\w+\.tmi\.twitch\.tv PRIVMSG #\w+ :(.+)/);
            if (match) {
              const username = match[1];
              const message = match[2];
              const isOwn = username === state.userData.login.toLowerCase();
              addChatMessage(username, message, isOwn ? '#9147ff' : '#adadb8');
            }
          }
        });
      };

      socket.onclose = () => {
        state.ircConnected = false;
        els.chatStatus.textContent = 'Отключен';
        els.chatStatus.classList.remove('connected');
      };

      socket.onerror = (err) => {
        console.error('Ошибка IRC:', err);
      };
    }

    function sendChatMessage(message) {
      if (!state.ircSocket || !state.ircConnected) return;
      if (!message.trim()) return;

      state.ircSocket.send(`PRIVMSG #${state.currentChannel} :${message}`);
      els.chatInput.value = '';
    }

    function addChatMessage(author, text, color) {
      const div = document.createElement('div');
      div.className = 'chat-message';
      div.innerHTML = `<span class="chat-message-author" style="color:${color}">${escapeHtml(author)}</span><span class="chat-message-text">${escapeHtml(text)}</span>`;
      els.chatMessages.appendChild(div);
      els.chatMessages.scrollTop = els.chatMessages.scrollHeight;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ================================================================
    // ПЛЕЕР (ТОЛЬКО ВИДЕО, БЕЗ ВСТРОЕННОГО ЧАТА)
    // ================================================================
    function initPlayer(channel) {
      els.embedContainer.innerHTML = '';

      state.embed = new Twitch.Embed('twitch-embed', {
        width: '100%',
        height: '100%',
        channel: channel,
        layout: 'video',  // ТОЛЬКО видео, без чата
        parent: [window.location.hostname],
        theme: 'dark',
        autoplay: true,
        muted: false
      });
    }

    // ================================================================
    // ПЕРЕКЛЮЧЕНИЕ КАНАЛА
    // ================================================================
    async function switchChannel(channel) {
      channel = channel.toLowerCase().trim();
      if (!channel) return;

      state.currentChannel = channel;
      els.playerTitle.textContent = channel;
      els.playerSubtitle.textContent = 'Загрузка...';

      initPlayer(channel);
      els.chatMessages.innerHTML = '';
      connectToChat(channel);

      // Загружаем данные
      try {
        const token = await getAppAccessToken();
        const res = await fetch(`https://api.twitch.tv/helix/users?login=${channel}`, {
          headers: { 'Client-ID': CLIENT_ID, 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.data && data.data[0]) {
          const user = data.data[0];
          els.playerAvatar.src = user.profile_image_url;
          els.playerTitle.textContent = user.display_name;
        }

        const streamRes = await fetch(`https://api.twitch.tv/helix/streams?user_login=${channel}`, {
          headers: { 'Client-ID': CLIENT_ID, 'Authorization': `Bearer ${token}` }
        });
        const streamData = await streamRes.json();
        if (streamData.data && streamData.data[0]) {
          const s = streamData.data[0];
          els.playerSubtitle.innerHTML = `<span class="live-badge">LIVE</span> ${s.game_name || 'Без категории'} · ${s.viewer_count} зрителей`;
          els.playerAvatar.classList.add('live');
        } else {
          els.playerSubtitle.textContent = 'Не в эфире';
          els.playerAvatar.classList.remove('live');
        }
      } catch (err) {
        console.error(err);
      }
    }

    // ================================================================
    // ПОИСК
    // ================================================================
    let searchTimeout;
    els.searchInput.addEventListener('input', () => {
      clearTimeout(searchTimeout);
      const query = els.searchInput.value.trim();
      if (query.length < 2) {
        els.searchResults.classList.remove('visible');
        return;
      }
      searchTimeout = setTimeout(async () => {
        try {
          const token = await getAppAccessToken();
          const res = await fetch(`https://api.twitch.tv/helix/search/channels?query=${encodeURIComponent(query)}&first=10`, {
            headers: { 'Client-ID': CLIENT_ID, 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          renderSearchResults(data.data || []);
        } catch (err) { console.error(err); }
      }, 350);
    });

    function renderSearchResults(channels) {
      if (channels.length === 0) {
        els.searchResults.innerHTML = '<div style="padding:20px;text-align:center;color:#adadb8">Ничего не найдено</div>';
        els.searchResults.classList.add('visible');
        return;
      }

      els.searchResults.innerHTML = channels.map(ch => `
        <div class="search-item" data-channel="${ch.broadcaster_login}">
          <img class="search-item-avatar ${ch.is_live ? 'live' : ''}" src="${ch.thumbnail_url}" alt="" onerror="this.style.visibility='hidden'" />
          <div class="search-item-info">
            <div class="search-item-name">${ch.display_name} ${ch.is_live ? '<span class="live-badge">LIVE</span>' : ''}</div>
            <div class="search-item-game">${ch.game_name || 'Без категории'}</div>
          </div>
        </div>
      `).join('');

      els.searchResults.classList.add('visible');
      els.searchResults.querySelectorAll('.search-item').forEach(el => {
        el.addEventListener('click', () => {
          switchChannel(el.dataset.channel);
          els.searchInput.value = '';
          els.searchResults.classList.remove('visible');
        });
      });
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-wrapper')) {
        els.searchResults.classList.remove('visible');
      }
    });

    // ================================================================
    // СОБЫТИЯ
    // ================================================================
    els.loginBtn.addEventListener('click', loginWithTwitch);
    els.logoutBtn.addEventListener('click', logout);

    els.chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        sendChatMessage(els.chatInput.value);
      }
    });

    // ================================================================
    // ИНИЦИАЛИЗАЦИЯ
    // ================================================================
    async function init() {
      // Проверяем callback от OAuth
      const wasCallback = await handleOAuthCallback();

      // Загружаем сохранённый токен
      const savedToken = localStorage.getItem('twitch_user_token');
      if (savedToken) {
        state.userAccessToken = savedToken;
        await loadUserData();
      }

      // Загружаем канал по умолчанию
      switchChannel('twitch');
    }

    init();
  </script>
</body>
</html>
